<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>To Do List</title>
  </head>
  <body>
    <div id="app">
      <button id="toggleMode">Toggle Mode</button>
      <hr />
      <form id="taskForm">
        <fieldset id="todoSet">
          <legend>Todo:</legend>
          <label>Description:</label>
          <input type="text" name="todoDescription" />
        </fieldset>

        <fieldset id="reminderSet" style="display: none">
          <legend>Reminder:</legend>

          <label>Description:</label>
          <input type="text" name="reminderDescription" />

          <label>Date:</label>
          <input type="date" name="scheduleDate" />

          <select name="notification">
            <option value="SMS">SMS</option>
            <option value="EMAIL">EMAIL</option>
            <option value="PUSH_NOTIFICATION">Push notification</option>
          </select>
        </fieldset>

        <button type="submit">Submit</button>
      </form>
      <br />
      <ul id="tasksList" style="white-space: pre-line; list-style: none"></ul>
    </div>
    <script src="./dist/index.js"></script>
  </body>
</html>
